<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- EduGuide Brand Gradient (Vibrant Warm Orange) -->
    <linearGradient id="egBgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <linearGradient id="tasselGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Soft Shadow for contrast in both dark & light browser chrome -->
    <filter id="egGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Background Squircle with EduGuide Orange -->
  <rect width="180" height="180" rx="42" fill="url(#egBgGrad)" />

  <!-- Subtle Inner Ring Highlight -->
  <rect x="4" y="4" width="172" height="172" rx="38" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />

  <!-- 2. University Graduation Cap Accent (Academic Excellence Symbol) -->
  <g filter="url(#egGlow)">
    <!-- Cap Diamond Crown -->
    <polygon points="90,26 148,46 90,66 32,46" fill="#0F172A" />
    <polygon points="90,28 144,46 90,64 36,46" fill="#1E293B" />
    
    <!-- Cap Skull Base -->
    <path d="M54,53 L54,72 C54,82 126,82 126,72 L126,53" fill="#0F172A" />

    <!-- Golden Tassel hanging to the left -->
    <path d="M90,46 Q64,52 60,78" stroke="url(#tasselGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="60" cy="80" r="4" fill="#F59E0B" />
    <circle cx="90" cy="46" r="3.5" fill="#FCD34D" />
  </g>

  <!-- 3. Bold EduGuide Monogram: EG -->
  <g filter="url(#egGlow)">
    <text 
      x="90" 
      y="142" 
      fill="#FFFFFF" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
      font-weight="900" 
      font-size="64" 
      letter-spacing="-2"
      text-anchor="middle"
    >EG</text>
  </g>
</svg>
