<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* ── 60FPS HARDWARE ACCELERATED ANIMATIONS ── */
      @keyframes floatMascot {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes pulseAura {
        0%, 100% { transform: scale(1); opacity: 0.75; }
        50% { transform: scale(1.1); opacity: 1; }
      }

      @keyframes rotateHolo {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes beaconGlow {
        0%, 100% { transform: scale(1); opacity: 0.85; filter: drop-shadow(0 0 4px #FF5500); }
        50% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 14px #FFAA00); }
      }

      @keyframes eyeBlink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.12); }
      }

      @keyframes eyeGlow {
        0%, 100% { filter: drop-shadow(0 0 3px #FF5500); }
        50% { filter: drop-shadow(0 0 9px #FFAA00); }
      }

      @keyframes tasselSway {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(6deg); }
      }

      @keyframes barScan {
        0%, 100% { width: 40px; }
        50% { width: 62px; }
      }

      .aura-glow {
        transform-origin: 200px 200px;
        animation: pulseAura 3.8s ease-in-out infinite;
      }

      .holo-ring {
        transform-origin: 200px 200px;
        animation: rotateHolo 20s linear infinite;
      }

      .mascot-character {
        animation: floatMascot 3.6s ease-in-out infinite;
      }

      .beacon-light {
        transform-origin: 200px 38px;
        animation: beaconGlow 1.8s ease-in-out infinite;
      }

      .eyes-anim {
        transform-origin: 200px 186px;
        animation: eyeBlink 4.2s ease-in-out infinite, eyeGlow 2.4s ease-in-out infinite;
      }

      .tassel-anim {
        transform-origin: 200px 84px;
        animation: tasselSway 2.8s ease-in-out infinite;
      }

      .tech-scan {
        animation: barScan 2.6s ease-in-out infinite;
      }
    </style>

    <!-- Ambient Glow Radial -->
    <radialGradient id="iconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FF8800" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Robot Body -->
    <linearGradient id="bodyMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Dark High-Tech Visor -->
    <linearGradient id="visorDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- EduGuide Brand Orange -->
    <linearGradient id="primaryOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>

    <!-- Graduation Cap Color -->
    <linearGradient id="gradCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="iconGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF5500" flood-opacity="0.5"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 1. Ambient Background Glow Aura -->
  <circle class="aura-glow" cx="200" cy="200" r="175" fill="url(#iconGlow)"/>

  <!-- 2. Rotating Hologram Dashed Halo -->
  <circle class="holo-ring" cx="200" cy="200" r="182" stroke="#FF5500" stroke-opacity="0.32" stroke-width="2.5" stroke-dasharray="8 10"/>
  <circle class="holo-ring" cx="200" cy="200" r="158" stroke="#FF8800" stroke-opacity="0.22" stroke-width="1.8" stroke-dasharray="14 14"/>

  <!-- 3. Focused Robot Character (Floating Animation) -->
  <g class="mascot-character" transform="translate(0, 0)">
    
    <!-- Antenna Beacon Base & Rod -->
    <line x1="200" y1="58" x2="200" y2="38" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    <circle class="beacon-light" cx="200" cy="38" r="7.5" fill="url(#primaryOrange)" filter="url(#iconGlowFilter)"/>

    <!-- Graduation Cap -->
    <polygon points="200,58 296,82 200,106 104,82" fill="url(#gradCap)" filter="url(#softShadow)"/>
    <path d="M142,88 L142,112 C142,126 258,126 258,112 L258,88 Z" fill="#0F172A"/>
    
    <!-- Cap Gold/Orange Swaying Tassel -->
    <g class="tassel-anim">
      <path d="M200,84 L152,108 L148,136" stroke="#FF5500" stroke-width="3" stroke-linecap="round"/>
      <circle cx="148" cy="139" r="5" fill="#FF5500" filter="url(#iconGlowFilter)"/>
    </g>

    <!-- Robot Head Container -->
    <rect x="118" y="122" width="164" height="140" rx="42" fill="url(#bodyMetal)" stroke="#CBD5E1" stroke-width="2" filter="url(#softShadow)"/>

    <!-- Ear Cyber Pods -->
    <rect x="105" y="160" width="14" height="38" rx="7" fill="url(#primaryOrange)"/>
    <rect x="281" y="160" width="14" height="38" rx="7" fill="url(#primaryOrange)"/>

    <!-- Dark High-Tech Visor Screen -->
    <rect x="134" y="144" width="132" height="82" rx="26" fill="url(#visorDark)"/>

    <!-- Cheerful Glowing Cyber Eyes with Blink Animation -->
    <g class="eyes-anim">
      <!-- Left Eye -->
      <path d="M158,184 C158,174 174,174 174,184" stroke="#FF5500" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="166" cy="176" r="3" fill="#FFAA00" filter="url(#iconGlowFilter)"/>

      <!-- Right Eye -->
      <path d="M226,184 C226,174 242,174 242,184" stroke="#FF5500" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="234" cy="176" r="3" fill="#FFAA00" filter="url(#iconGlowFilter)"/>
    </g>

    <!-- Friendly Cheerful Smile -->
    <path d="M192,204 C196,209 204,209 208,204" stroke="#FF8800" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Neck Connector -->
    <rect x="178" y="260" width="44" height="14" rx="5" fill="#64748B"/>

    <!-- Robot Torso -->
    <path d="M128,272 C128,272 142,272 200,272 C258,272 272,272 272,272 C285,272 295,283 293,296 L283,354 C281,364 271,372 260,372 L140,372 C129,372 119,364 117,354 L107,296 C105,283 115,272 128,272 Z" fill="url(#bodyMetal)" stroke="#CBD5E1" stroke-width="2" filter="url(#softShadow)"/>

    <!-- Chest Logo Emblem (EG) -->
    <circle cx="200" cy="314" r="23" fill="url(#primaryOrange)" filter="url(#iconGlowFilter)"/>
    <text x="200" y="320" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle">EG</text>

    <!-- Tech Progress Scan Bar -->
    <rect x="168" y="346" width="64" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect class="tech-scan" x="168" y="346" width="44" height="5" rx="2.5" fill="url(#primaryOrange)"/>
  </g>
</svg>
