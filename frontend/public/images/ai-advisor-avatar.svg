<svg width="600" height="520" viewBox="0 0 600 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radial Ambient Glow -->
    <radialGradient id="aiGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF8800" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>

    <!-- Robot Metallic Gradients -->
    <linearGradient id="metalBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="visorOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="brandOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>

    <linearGradient id="capBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FF5500" flood-opacity="0.35"/>
    </filter>

    <filter id="softCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Light Orbs -->
  <circle cx="300" cy="260" r="240" fill="url(#aiGlow)"/>

  <!-- Hologram Circular Rings -->
  <circle cx="300" cy="270" r="190" stroke="#FF5500" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="300" cy="270" r="160" stroke="#FF7700" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Left Floating Badge: 99.4% Accuracy -->
  <g transform="translate(60, 160)" filter="url(#softCardShadow)">
    <rect width="170" height="52" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="26" r="14" fill="#ECFDF5"/>
    <path d="M23 26L26.5 29.5L33 22.5" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="24" fill="#0F172A" font-family="system-ui, sans-serif" font-weight="800" font-size="12">99.4% Verified</text>
    <text x="50" y="38" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Official Circular Criteria</text>
  </g>

  <!-- Right Floating Badge: 24/7 AI Tutor -->
  <g transform="translate(370, 340)" filter="url(#softCardShadow)">
    <rect width="170" height="52" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="28" cy="26" r="14" fill="#FFF7ED"/>
    <circle cx="28" cy="26" r="6" fill="#FF5500"/>
    <text x="50" y="24" fill="#0F172A" font-family="system-ui, sans-serif" font-weight="800" font-size="12">Live 24/7 Advisor</text>
    <text x="50" y="38" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Instant Admission Guidance</text>
  </g>

  <!-- AI Robot Body Group -->
  <g transform="translate(190, 110)">
    <!-- Graduation Cap Top -->
    <polygon points="110,25 210,50 110,75 10,50" fill="url(#capBlack)" filter="url(#softCardShadow)"/>
    <!-- Cap Skullcap -->
    <path d="M50 55L50 82C50 98 170 98 170 82L170 55Z" fill="#0F172A"/>
    <!-- Cap Gold Tassel -->
    <path d="M110 50L60 75L56 105" stroke="#FF5500" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="56" cy="108" r="5" fill="#FF5500"/>

    <!-- Antenna with glowing orb -->
    <line x1="110" y1="25" x2="110" y2="2" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="110" cy="2" r="7" fill="url(#brandOrange)" filter="url(#glowFilter)"/>

    <!-- Head Container -->
    <rect x="25" y="90" width="170" height="145" rx="42" fill="url(#metalBody)" stroke="#CBD5E1" stroke-width="2" filter="url(#softCardShadow)"/>

    <!-- Head Ear Pods -->
    <rect x="12" y="130" width="14" height="40" rx="7" fill="url(#brandOrange)"/>
    <rect x="194" y="130" width="14" height="40" rx="7" fill="url(#brandOrange)"/>

    <!-- Visor (Screen) -->
    <rect x="42" y="112" width="136" height="84" rx="26" fill="url(#visorOrange)"/>

    <!-- Glowing Cyber Eyes (Friendly Curved Cheerful Expression) -->
    <path d="M68 152C68 142 84 142 84 152" stroke="#FF5500" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="76" cy="144" r="3" fill="#FFAA00" filter="url(#glowFilter)"/>

    <path d="M136 152C136 142 152 142 152 152" stroke="#FF5500" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="144" cy="144" r="3" fill="#FFAA00" filter="url(#glowFilter)"/>

    <!-- Cheerful Visor Smile -->
    <path d="M102 172C106 177 114 177 118 172" stroke="#FF8800" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck Connector -->
    <rect x="88" y="235" width="44" height="16" rx="6" fill="#64748B"/>

    <!-- Body Torso -->
    <path d="M35 250C35 250 50 250 110 250C170 250 185 250 185 250C198 250 208 262 206 275L194 340C192 352 180 360 168 360L52 360C40 360 28 352 26 340L14 275C12 262 22 250 35 250Z" fill="url(#metalBody)" stroke="#CBD5E1" stroke-width="2" filter="url(#softCardShadow)"/>

    <!-- Chest Logo Badge -->
    <circle cx="110" cy="295" r="24" fill="url(#brandOrange)" filter="url(#glowFilter)"/>
    <text x="110" y="301" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle">EG</text>

    <!-- Chest Tech Bars -->
    <rect x="75" y="328" width="70" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="75" y="328" width="48" height="5" rx="2.5" fill="url(#brandOrange)"/>
  </g>
</svg>
